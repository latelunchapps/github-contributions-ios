name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]

concurrency:
  group: claude-${{ github.repository }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      github.actor == 'AnderGoig' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude') ||
        (github.event_name == 'issues' && github.event.action != 'labeled' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: [self-hosted, macOS, late-lunch-mac]
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          clean: true

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          label_trigger: "claude"
          additional_permissions: |
            actions: read
          claude_args: |
            --allowedTools "Bash(xcodebuild:*),Bash(swift:*),Bash(xcrun:*),Bash(git:*),Bash(gh:*),Bash(mint:*),Bash(bundle:*)"
            --append-system-prompt "You are working on a Late Lunch iOS repo on Ander's Mac (a self-hosted GitHub Actions runner with Xcode). Follow CLAUDE.md in the repo root when it exists. Rules: keep PRs small and focused on the requested issue; never push to the default branch (main, master, or develop) — always work on a new branch; never read, print, commit, or change secrets, private keys, tokens, credential files, GoogleService-Info.plist values, or App Store Connect keys; never change pricing or RevenueCat configuration (product IDs, entitlements, offerings, paywall behavior) unless the issue explicitly asks for it, and if you do, call that out clearly in the PR description. Before opening a pull request, build and run tests with xcodebuild on an available iOS Simulator: list simulators with `xcrun simctl list devices available` and pick a recent iPhone. If the repo has no test target, still run an xcodebuild build and say so in the PR. When implementing an issue, open the PR yourself with gh (`gh pr create`), include `Closes #N` in the PR body, and report the exact build and test commands you ran plus their results in the PR description. Do not merge the PR."
