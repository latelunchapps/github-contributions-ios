name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]

jobs:
  claude:
    # Job-level concurrency (not workflow-level): a skipped job, such as a
    # comment from claude[bot], must not occupy the group and queue behind an
    # in-progress run. Groups are still per-repository; the single Mac runner
    # serializes work across Late Lunch repos.
    if: |
      github.actor == 'AnderGoig' &&
      (
        (github.event_name == 'issue_comment' && github.event.comment.user.type != 'Bot' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && github.event.comment.user.type != 'Bot' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && github.event.review.user.type != 'Bot' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude') ||
        (github.event_name == 'issues' && github.event.action != 'labeled' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: [self-hosted, macOS, late-lunch-mac]
    timeout-minutes: 60
    concurrency:
      group: claude-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history. On a persistent runner later jobs only fetch new commits,
          # and Claude can branch, push, and inspect history. fetch-depth: 1 would
          # also allow a new branch from HEAD, but blame/log/merge-base are shallow.
          fetch-depth: 0
          # git clean -ffdx && git reset --hard HEAD. This wipes ignored files
          # inside the workspace (node_modules, dist, .build) but not caches we
          # keep outside it (DerivedData-ci, ~/.npm). Do not put build products
          # in the workspace if they should survive across jobs.
          clean: true
          persist-credentials: true

      - name: Ensure persistent Xcode caches
        run: |
          root="$HOME/Library/Developer/Xcode/DerivedData-ci/${{ github.event.repository.name }}"
          mkdir -p "$root/SourcePackages" "$root/CompilationCache.noindex"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # Cold Xcode builds on the Mac runner take longer than Claude Code's
          # ~2 minute default Bash timeout, which ended runs before they pushed.
          BASH_DEFAULT_TIMEOUT_MS: "1200000"
          BASH_MAX_TIMEOUT_MS: "1200000"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          label_trigger: "claude"
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 60
            --allowedTools "Bash(xcodebuild:*),Bash(swift:*),Bash(xcrun:*),Bash(git:*),Bash(gh:*),Bash(swiftlint:*),Bash(/opt/homebrew/bin/swiftlint:*),Bash(bundle:*)"
            --append-system-prompt "You are working on a Late Lunch iOS repo on Ander's Mac (a self-hosted GitHub Actions runner with Xcode). Follow CLAUDE.md in the repo root when it exists. Run SwiftLint as `/opt/homebrew/bin/swiftlint` (full path, no PATH changes or env prefixes); do not use mint. Rules: keep PRs small and focused on the requested issue; never push to the default branch (main, master, or develop) — always work on a new branch; never read, print, commit, or change secrets, private keys, tokens, credential files, GoogleService-Info.plist values, or App Store Connect keys; never change pricing or RevenueCat configuration (product IDs, entitlements, offerings, paywall behavior) unless the issue explicitly asks for it, and if you do, call that out clearly in the PR description. When implementing an issue, open the PR yourself with gh (`gh pr create`), include `Closes #N` in the PR body, and report the exact build and test commands you ran plus their results in the PR description. Do not merge the PR. Build caches must live outside the workspace so checkout's git clean -ffdx does not wipe them. Always pass these xcodebuild flags (create the dirs if needed): `-derivedDataPath \"$HOME/Library/Developer/Xcode/DerivedData-ci/<repo>\"` `-clonedSourcePackagesDirPath \"$HOME/Library/Developer/Xcode/DerivedData-ci/<repo>/SourcePackages\"` `COMPILATION_CACHE_ENABLE_CACHING=YES` `COMPILATION_CACHE_CAS_PATH=\"$HOME/Library/Developer/Xcode/DerivedData-ci/<repo>/CompilationCache.noindex\"`. Use the exact commands in CLAUDE.md. Pick a simulator with `xcrun simctl list devices available` and target it by id if names collide. If the repo has no test target, still run an xcodebuild build and say so in the PR. Do not use the default DerivedData path (it would mix with local Xcode builds) and do not put DerivedData inside the repo."
